name: Bug report
description: Report incorrect or unexpected behavior.
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve Game Store. Never include credentials or real customer data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Submit...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the browser, operating system and application environment.
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add sanitized logs or screenshots when useful.
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: I confirmed that this report contains no passwords, tokens, keys or personal data.
          required: true
